<body id="home" class="{{bodyClass}}">
<a class="skip" href="#main">Skip to content</a>
<header class="hd">
  <div class="hd-wrap">
    <a class="mark" href="{{homePrefix}}#home" aria-label="Lawler Collective, home">
      {{wordmark}}
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{homePrefix}}#home" data-section="top">Home</a>
      <a href="{{homePrefix}}#about" data-section="about">About</a>
      <a href="{{homePrefix}}#recent" data-section="recent">Recent</a>
      <a href="{{homePrefix}}#contact" data-section="contact">Contact</a>
      <div class="nav-drop">
        <button class="nav-drop-btn" type="button" aria-expanded="false" aria-controls="gallery-menu"{{galleryCurrent}}>Gallery<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <ul class="nav-menu" id="gallery-menu">
{{galleryLinks}}
        </ul>
      </div>
    </nav>
  </div>
</header>

{{content}}

<footer>
  <div class="ft-wrap">
    {{footerIcon}}
    <span class="footer-text">&copy; {{year}} Lawler Collective LLC, All Rights Reserved.<span class="footer-version">{{version}}</span></span>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <img alt="">
  <div class="lb-ui">
    <button class="lb-btn lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" aria-label="Previous photo">&#8249;</button>
    <button class="lb-btn lb-next" aria-label="Next photo">&#8250;</button>
    <span class="lb-count"></span>
  </div>
</div>

<script>{{js}}</script>
</body>
</html>
